theme: osuny
_merge: deep

pagination:
  pagerSize: 12

params:
  # Design system
  logo:
    header: '/assets/images/logo.png'
    footer: '/assets/images/logo.png'
  # Fonction recherche
  search:
    active: true
    positions:
      - primary
      # - upper-menu
      # - fixed
      - footer

  share_links:
    enabled: false
    email: true
    facebook: true
    mastodon: true
    linkedin: true

  home:
    head:
      title: site

  # SECTIONS
  # default: # (???) possibilité d'ajouter un auteur? cf Ressources
  #   sitemap:
  #     ignore_children: false
  #   index:
  #     layout: list #ne fonctionne pas cf Ressources
  #     subtitle: false #ne fonctionne pas sur Accompagnements mais sur Ressources oui
  #     taxonomies:
  #       display: true
  #       layout: dropdown
  #       show_name: true
  #   single:
  #     taxonomies:
  #       position: content
  #       show_name: true
  # section PAGES
  # pages:
  #   index:
  #     options:
  #       author: true
  #       categories: true
  #       date: true
  # section CATEGORIES
  categories:
    index:
      layout: grid
      options:
        image: true
        summary: true
    single:
      taxonomies:
        display: false
  # section PROJETS
  projects:
    date_format: "2006"
    index:
      layout: grid
      options:
        summary: false
        year: true
        #(???) ordre des projets par ordre chrono ? (ancien au + récent)
    single:
      meta:
        position: hero
        options:
          reading_time: false
          with_labels: false
          year: false
      toc:                          
        disabled: true # nefonctionne pas
  # section Actualités    
  posts: #(???) Possibilité d'archive/tri par année ?
    default_image: false #concerne quelle image ?
    index:
      layout: grid
      options:
        author: true
        summary: false
        subtitle: false
    single:
      meta:
        position: hero
        options:
          reading_time: false
          with_labels: false
      options:
        signature: false #qu'est-ce que c'est ?
      share_links:
        enabled: true #ne fonctionne pas
  # section PERSONNES
  persons:
    index:
      taxonomies:
        display: false
  # organizations:
  #   index:
  #     options:
  #       link: true

  image_sizes:
      sections:
        projects:
          hero_single:
            mobile:   400
            tablet:   800
            desktop:  1600
        pages:
          layouts:
            grid:
              mobile:   700
              tablet:   1000
              desktop:  1500