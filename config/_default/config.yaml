theme: osuny
_merge: deep
services:
  rss:
    limit: 100

pagination:
  pagerSize: 36

params:
  summary:
    position: hero

  # Design system
  logo:
    header: '/assets/images/logo.png'
    footer: '/assets/images/logo.png'
  # Table des matières
  toc:                          
    force_offcanvas: false
    disabled: true
  # Fonction recherche
  search:
    active: true
    positions:
      - primary
      # - upper-menu
      # - fixed
      - footer

  share_links:
    enabled: false
    email: true
    facebook: true
    mastodon: true
    linkedin: true

  home:
    head:
      title: site

  # SECTIONS
  default:
    sitemap:
      ignore_children: false
    index:
      layout: list # ne fonctionne pas
      subtitle: false # ne fonctionne pas 
      taxonomies:
        display: true
        layout: dropdown
        show_name: true
    single:
      taxonomies:
        position: content
        show_name: true
  # section PAGES
  pages:
    index:
      options:
        author: true
        categories: true
        date: true
  # section CATEGORIES
  categories:
    index:
      layout: grid
      options:
        image: true
        summary: true
    single:
      taxonomies:
        display: false
  # section PROJETS
  projects:
    date_format: "2006"
    index:
      layout: grid
      options:
        summary: false
        year: true
    single:
      taxonomies:
        display: true
        position: hero
        show_name: false
      year: false # ne fonctionne pas
  # section Actualités    
  posts:
    default_image: false #concerne quelle image ?
    index:
      layout: grid
      options:
        author: true
        summary: false
        subtitle: false
    single:
      options:
        authors: true
        published_at: false
        reading_time: true
        signature: false #qu'est-ce que c'est ?
        updated_at: true
      share_links:
        enabled: true #ne fonctionne pas
  # section PERSONNES
  persons:
    index:
      taxonomies:
        display: false
      toc:
        enabled: true #ne fonctionne pas

