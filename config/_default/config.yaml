theme: osuny
_merge: deep
services:
  rss:
    limit: 100
params:
  summary:
    position: hero

  # Design system
  logo:
    header: '/assets/images/logo.png'
    footer: '/assets/images/logo.png'
  # breadcrumb:
  #   extendable: false
  #   position: hero-start # hero-start | hero-end | after-hero | after-hero-title | none
  search:
    active: true
    positions:
      - primary
      # - upper-menu
      # - fixed
      # - footer
  share_links:
    enabled: true
    email: true
    facebook: true
    mastodon: true
    linkedin: true
  home:
    head:
      title: site

  # SECTIONS
  default:
    index:
      taxonomies:
        display: true
        layout: dropdown # dropdown | inline
        show_name: true


  # BLOCKS
  blocks:
    image_sizes:
    _default:
      carousel:
        mobile:   360
        tablet:   555
        desktop:  575