theme: osuny
_merge: deep
services:
  rss:
    limit: 100

pagination:
  pagerSize: 36

params:
  summary:
    position: hero

  # Design system
  logo:
    header: '/assets/images/logo.png'
    footer: '/assets/images/logo.png'
  
  toc:                          # Table des matières (globale)
    force_offcanvas: false      # N'est pas forcée en panneau latéral hors-canvas
    disabled: true             # Activée par défaut
  
  search:
    active: true
    positions:
      - primary
      # - upper-menu
      # - fixed
      - footer

  share_links:
    enabled: false
    email: true
    facebook: true
    mastodon: true
    linkedin: true

  home:
    head:
      title: site

  # SECTIONS
  default:
    sitemap:
      ignore_children: false
    index:
      subtitle: false
      taxonomies:
        display: true
        layout: dropdown # dropdown | inline
        show_name: true
      options:
        author: true
        categories: true
        date: true
        
    single:
      taxonomies:
        position: content # content | hero | none
        layout: inline # dropdown | inline
        show_name: true

  pages:
    index:
      options:
        author: true
        categories: true
        date: true

  categories:
    index:
      layout: grid
      options:
        image: true
        summary: true
    single:
      taxonomies:
        display: false

  projects:
    date_format: "2006"
    index:
      layout: grid
      options:
        categories: true
        image: true
        subtitle: true
        summary: false
        year: true
      truncate_description: 200 # Set to 0 to disable truncate
    single:
      taxonomies:
        position: hero # content | hero | none
        display: true
        show_name: false
      year: false

  
  # Actualités    
  posts:
    index:
      layout: grid
      options:
        author: true
        categories: true
        date: true
        image: true
        reading_time: false
        summary: false
        subtitle: false
    single:
      options:
        authors: true
        published_at: false
        reading_time: true
        signature: false
        updated_at: true
        image: true
      share_links:
        enabled: true #ne fonctionne pas

  persons:
    index:
      taxonomies:
        display: false
      toc: true #ne fonctionne pas

