theme: osuny
_merge: deep

pagination:
  pagerSize: 12

params:
  # Design system
  logo:
    header: '/assets/images/logo.png'
    footer: '/assets/images/logo.png'
  # Fonction recherche
  search:
    active: true
    positions:
      - primary
      # - upper-menu
      # - fixed
      - footer

  share_links:
    enabled: false
    email: true
    facebook: true
    mastodon: true
    linkedin: true

  home:
    head:
      title: site

  # SECTIONS
  # default: # (???) possibilité d'ajouter un auteur? cf Ressources
  #   sitemap:
  #     ignore_children: false
  #   index:
  #     layout: list #ne fonctionne pas cf Ressources
  #     subtitle: false #ne fonctionne pas sur Accompagnements mais sur Ressources oui
  #     taxonomies:
  #       display: true
  #       layout: dropdown
  #       show_name: true
  #   single:
  #     taxonomies:
  #       position: content
  #       show_name: true
  # section PAGES
  # pages:
  #   index:
  #     options:
  #       author: true
  #       categories: true
  #       date: true
  # section CATEGORIES
  categories:
    index:
      layout: grid
      options:
        image: true
        summary: true
    single:
      taxonomies:
        display: false
  # section PROJETS
  projects:
    date_format: "2006"
    index:
      layout: grid
      options:
        summary: false
        year: true
        #(???) ordre des projets par ordre chrono ? (ancien au + récent)
    single:
      taxonomies:
        display: true
        position: hero
        show_name: false
      toc:                          
        disabled: true # nefonctionne pas
      year: false #ne fonctionne pas
  # section Actualités    
  posts: #(???) Possibilité d'archive/tri par année ?
    default_image: false #concerne quelle image ?
    index:
      layout: grid
      options:
        author: true
        summary: false
        subtitle: false
    single:
      options:
        authors: true
        published_at: false
        reading_time: true
        signature: false #qu'est-ce que c'est ?
        updated_at: true
      share_links:
        enabled: true #ne fonctionne pas
  # section PERSONNES
  persons:
    index:
      taxonomies:
        display: false
      toc:
        enabled: true #ne fonctionne pas

  image_sizes:
      sections:
        projects:
          hero_single:
            mobile:   400
            tablet:   800
            desktop:  1600

          alternate: 
            mobile:   350
            tablet:   555
            desktop:  1019
          grid:
            mobile:   350
            tablet:   555
            desktop:  864
          large:
            mobile:   350
            tablet:   555
            desktop:  1019
          list:
            mobile:   90
            tablet:   350
            desktop:  415